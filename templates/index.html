<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - NoteSphereX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%238bc5a5'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M12%202L2%207l10%205%2010-5-10-5z'/%3E%3Cpath%20d='M2%2017l10%205%2010-5'/%3E%3Cpath%20d='M2%2012l10%205%2010-5'/%3E%3C/svg%3E">
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="dash-body">

    <!-- ── Ambient Background ── -->
    <div class="dash-bg">
        <div class="dash-orb dash-orb-1"></div>
        <div class="dash-orb dash-orb-2"></div>
        <div class="dash-grid"></div>
    </div>

    <div class="dash-layout" id="dashLayout">
        <aside class="dash-sidebar" id="dashSidebar" aria-label="Main navigation">
            <div class="dash-sidebar-top">
                <a class="dash-sidebar-brand" href="/dashboard" aria-label="NoteSphereX home">
                    <span class="dash-brand-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                        </svg>
                    </span>
                    <span class="dash-brand-name">NoteSphereX</span>
                </a>
                <button class="dash-sidebar-close" id="sidebarClose" type="button" aria-label="Close navigation">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <nav class="dash-sidebar-nav" aria-label="Main">
                <a class="dash-sidebar-link" href="#noteContent" data-sidebar-link aria-label="New Note" title="New Note">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    <span class="dash-sidebar-label">New Note</span>
                </a>
                <a class="dash-sidebar-link is-active" href="#notesList" data-sidebar-link aria-current="page" aria-label="All Notes" title="All Notes">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>
                    </svg>
                    <span class="dash-sidebar-label">All Notes</span>
                </a>
                <a class="dash-sidebar-link" href="/messages" data-sidebar-link aria-label="Messages" title="Messages">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>
                    </svg>
                    <span class="dash-sidebar-label">Messages</span>
                </a>
                <a class="dash-sidebar-link" href="/settings" data-sidebar-link aria-label="Settings" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.8-.7a8 8 0 0 1-1.7 1l-.3 1.9h-2.8l-.3-1.9a8 8 0 0 1-1.7-1l-1.8.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.8.7a8 8 0 0 1 1.7-1l.3-1.9h2.8l.3 1.9a8 8 0 0 1 1.7 1l1.8-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z" transform="translate(-1 -1)"/>
                    </svg>
                    <span class="dash-sidebar-label">Settings</span>
                </a>
            </nav>
        </aside>

        <button class="dash-sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>

        <div class="dash-workspace">
            <header class="dash-header">
                <div class="dash-header-inner">
                    <button class="dash-menu-btn" id="sidebarMenu" type="button" aria-label="Open navigation" aria-controls="dashSidebar" aria-expanded="false">
                        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                        </svg>
                    </button>
                    <button class="dash-collapse-btn" id="sidebarCollapse" type="button" aria-label="Collapse sidebar" aria-controls="dashSidebar" aria-expanded="true" title="Collapse sidebar">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-8h3"/>
                        </svg>
                    </button>
                    <div class="dash-header-actions">
                        <div class="dash-note-count">
                            <span id="noteCountBadge">0 notes</span>
                        </div>
                        <div class="profile-menu" data-profile-menu>
                            <button class="profile-trigger" id="profileMenuButton" type="button" aria-label="Open profile menu" aria-haspopup="menu" aria-expanded="false" aria-controls="profileDropdown" title="Profile">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>
                                </svg>
                            </button>
                            <div class="profile-dropdown" id="profileDropdown" role="menu" aria-labelledby="profileMenuButton" hidden>
                                <a class="profile-menu-item" href="/settings" role="menuitem">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.8-.7a8 8 0 0 1-1.7 1l-.3 1.9h-2.8l-.3-1.9a8 8 0 0 1-1.7-1l-1.8.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.8.7a8 8 0 0 1 1.7-1l.3-1.9h2.8l.3 1.9a8 8 0 0 1 1.7 1l1.8-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z" transform="translate(-1 -1)"/>
                                    </svg>
                                    <span>Settings</span>
                                </a>
                                <button class="profile-menu-item profile-menu-logout" type="button" role="menuitem" onclick="logout()">
                                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                                    </svg>
                                    <span>Logout</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="dash-main">

        <!-- ── Page Heading ── -->
        <div class="dash-heading">
            <h2 class="dash-title">Your Notes</h2>
            <p class="dash-subtitle">Capture ideas, thoughts, and everything in between.</p>
        </div>

        <div class="dash-search" role="search">
            <svg class="dash-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
            </svg>
            <input id="noteSearch" class="dash-search-input" type="search" placeholder="Search notes..." aria-label="Search notes" autocomplete="off">
        </div>

        <div class="note-selection-toolbar">
            <button id="selectModeButton" class="note-selection-button" type="button" aria-pressed="false">Select</button>
            <div id="noteSelectionControls" class="note-selection-controls" hidden>
                <label class="note-select-all">
                    <input id="selectAllNotes" type="checkbox">
                    <span>Select All</span>
                </label>
                <span id="selectedNoteCount" class="note-selection-count" aria-live="polite">0 selected</span>
                <button id="deleteSelectedButton" class="note-btn note-btn-delete" type="button" disabled>Delete Selected</button>
            </div>
            <span id="bulkDeleteStatus" class="note-selection-status" role="status" aria-live="polite" hidden></span>
        </div>

        <!-- ── Compose Area ── -->
        <div class="dash-compose" id="noteComposer" hidden>
            <div class="dash-compose-inner">
                <div class="dash-editor-fields">
                    <input id="noteTitle" class="note-title-input" type="text" maxlength="160" placeholder="Note title (optional)" aria-label="Note title">
                    <select id="noteCategory" class="note-category-select" aria-label="Note category">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                        <option value="Ideas">Ideas</option>
                        <option value="Other" selected>Other</option>
                    </select>
                </div>
                <textarea id="noteContent" placeholder="Start writing a note..." class="dash-textarea"></textarea>
                <div class="dash-compose-footer">
                    <span class="dash-char-hint">Write something worth remembering.</span>
                    <span id="noteSaveStatus" class="dash-save-status" role="status" aria-live="polite" hidden></span>
                    <button id="noteSubmitButton" type="button" onclick="handleComposerAction()" class="dash-add-btn">
                        <svg id="noteSubmitIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span id="noteSubmitLabel">Add Note</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Notes List ── -->
        <div id="notesList" class="dash-notes-list">
            
        </div>

            </main>
            <button class="dash-create-fab" id="createNoteButton" type="button" aria-label="Create note" aria-controls="noteComposer" aria-expanded="false" title="Create note">
                <svg class="dash-create-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
            <dialog class="note-share-dialog" id="noteShareDialog" aria-labelledby="noteShareTitle">
                <div class="note-share-dialog-content">
                    <header class="note-share-dialog-header">
                        <div>
                            <h2 id="noteShareTitle">Share note</h2>
                            <p id="noteShareNoteTitle" class="note-share-note-title"></p>
                        </div>
                        <button class="note-share-close" id="closeNoteShare" type="button" aria-label="Close share dialog">&times;</button>
                    </header>
                    <div class="note-share-channel-row">
                        <span>Share using</span>
                        <button class="note-share-channel is-active" type="button" aria-pressed="true" disabled>Internal</button>
                    </div>
                    <label class="note-share-label" for="noteShareConversation">Choose a conversation</label>
                    <select class="note-share-input" id="noteShareConversation">
                        <option value="">Select a conversation</option>
                    </select>
                    <div class="note-share-or">or search for a user</div>
                    <label class="note-share-label" for="noteShareUserSearch">Search by username</label>
                    <input class="note-share-input" id="noteShareUserSearch" type="search" maxlength="100" placeholder="Enter a username" autocomplete="off">
                    <div class="note-share-results" id="noteShareUserResults" role="listbox" aria-label="Matching users" hidden></div>
                    <p class="note-share-status" id="noteShareStatus" role="status" aria-live="polite" hidden></p>
                    <footer class="note-share-dialog-actions">
                        <button class="note-share-cancel" id="cancelNoteShare" type="button">Cancel</button>
                        <button class="note-share-confirm" id="confirmNoteShare" type="button">Share note</button>
                    </footer>
                </div>
            </dialog>
        </div>
    </div>

<script src="/static/js/notes.js"></script>
<script src="/static/js/profile-menu.js"></script>
</body>
</html>
