<!DOCTYPE html>
<html>
<head>
    <title>Settings - NoteSphereX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="dash-body">
    <div class="dash-bg">
        <div class="dash-orb dash-orb-1"></div>
        <div class="dash-orb dash-orb-2"></div>
        <div class="dash-grid"></div>
    </div>

    <header class="dash-header">
        <div class="dash-header-inner settings-header-inner">
            <a class="dash-brand settings-brand" href="/dashboard" aria-label="NoteSphereX home">
                <span class="dash-brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                    </svg>
                </span>
                <span class="dash-brand-name">NoteSphereX</span>
            </a>
            <div class="dash-header-actions">
                <div class="profile-menu" data-profile-menu>
                    <button class="profile-trigger" id="profileMenuButton" type="button" aria-label="Open profile menu" aria-haspopup="menu" aria-expanded="false" aria-controls="profileDropdown" title="Profile">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>
                        </svg>
                    </button>
                    <div class="profile-dropdown" id="profileDropdown" role="menu" aria-labelledby="profileMenuButton" hidden>
                        <a class="profile-menu-item" href="/settings" role="menuitem">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.8-.7a8 8 0 0 1-1.7 1l-.3 1.9h-2.8l-.3-1.9a8 8 0 0 1-1.7-1l-1.8.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.8.7a8 8 0 0 1 1.7-1l.3-1.9h2.8l.3 1.9a8 8 0 0 1 1.7 1l1.8-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z" transform="translate(-1 -1)"/>
                            </svg>
                            <span>Settings</span>
                        </a>
                        <button class="profile-menu-item profile-menu-logout" type="button" role="menuitem" onclick="logout()">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                            </svg>
                            <span>Logout</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="settings-main">
        <div class="settings-heading">
            <h1 class="settings-title">Settings</h1>
            <p class="settings-subtitle">Account and application preferences.</p>
        </div>

        <section class="settings-section" aria-labelledby="settings-account-title">
            <h2 class="settings-section-title" id="settings-account-title">Account</h2>
            <div class="settings-account-row">
                <div class="settings-avatar" role="img" aria-label="Profile image placeholder">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>
                    </svg>
                </div>
                <div>
                    <span class="settings-account-label">Username</span>
                    <span class="settings-account-name" data-account-username>Signed-in account</span>
                </div>
            </div>
        </section>

        <section class="settings-section" aria-labelledby="settings-preferences-title">
            <h2 class="settings-section-title" id="settings-preferences-title">Preferences</h2>
            <fieldset class="settings-theme-fieldset">
                <legend>Theme preference</legend>
                <div class="settings-theme-options">
                    <label class="settings-theme-option">
                        <input type="radio" name="themePreference" value="light">
                        <span>Light</span>
                    </label>
                    <label class="settings-theme-option">
                        <input type="radio" name="themePreference" value="dark">
                        <span>Dark</span>
                    </label>
                    <label class="settings-theme-option">
                        <input type="radio" name="themePreference" value="system" checked>
                        <span>System</span>
                    </label>
                </div>
            </fieldset>
        </section>

        <section class="settings-section" aria-labelledby="settings-security-title">
            <h2 class="settings-section-title" id="settings-security-title">Security</h2>
            <div class="settings-password-grid">
                <div class="settings-password-field">
                    <label class="settings-password-label" for="currentPassword">Current password</label>
                    <input class="settings-password-input" id="currentPassword" type="password" placeholder="Current password" autocomplete="current-password" disabled>
                </div>
                <div class="settings-password-field">
                    <label class="settings-password-label" for="newPassword">New password</label>
                    <input class="settings-password-input" id="newPassword" type="password" placeholder="New password" autocomplete="new-password" disabled>
                </div>
            </div>
            <button class="settings-placeholder-btn" type="button" disabled>Change password</button>
        </section>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/profile-menu.js"></script>
</body>
</html>
